                context.scale(ratio,ratio); context.clearRect(0,0,width,height);
                context.font = '12px Arial'; context.direction = 'ltr'; context.fillStyle = '#606b82';
                if (!values.length) { context.textAlign = 'center'; context.fillText('הגרף יתחיל להתמלא אחרי התרגול הראשון',width / 2,height / 2,Math.max(100,width - 20)); return; }
                const left = 36; const top = 18; const bottom = 194; const right = width - 12;
                for (let step = 0; step <= 4; step++) {
                    const y = bottom - (bottom - top) * step / 4;
                    context.strokeStyle = '#e3e7ef'; context.lineWidth = 1; context.beginPath(); context.moveTo(left,y); context.lineTo(right,y); context.stroke();
                    context.textAlign = 'right'; context.fillStyle = '#606b82'; context.fillText(String(Math.round(maximum * step / 4)),left - 6,y + 4);
                }
                const step = (right - left) / Math.max(values.length,1);
                const points = values.map((value,index) => ({ x:left + step * (index + .5), y:bottom - (bottom - top) * value / maximum }));
                if (bars) {
                    context.fillStyle = '#5266dc';
                    points.forEach(point => context.fillRect(point.x - step * .32,point.y,step * .64,Math.max(2,bottom - point.y)));
                } else {
                    context.strokeStyle = '#334bce'; context.lineWidth = 3; context.beginPath();
                    points.forEach((point,index) => { if (!index) context.moveTo(point.x,point.y); else context.lineTo(point.x,point.y); });
                    context.stroke(); context.fillStyle = '#334bce';
                    points.forEach(point => { context.beginPath(); context.arc(point.x,point.y,4,0,Math.PI * 2); context.fill(); });
                }
                const interval = Math.max(1,Math.ceil(labels.length / Math.max(1,Math.floor((right - left) / (bars ? 24 : 44)))));
                context.textAlign = 'center'; context.fillStyle = '#606b82';
                points.forEach((point,index) => { if (index % interval === 0) context.fillText(labels[index],point.x,bottom + 22); });
            }
            achievementsScreen() {
                return `${this.heading('אוסף ההצלחות שלך', 'כל מדליה מספרת על התמדה, הבנה וצמיחה.')}<div class="grid two">${this.achievements.goals().map(goal => {
                    const earned = this.storage.data.achievements[goal.id];
                    const progress = Math.min(goal.value,goal.target);
                    return `<section class="card achievement ${earned ? 'earned' : ''}"><span class="icon" aria-hidden="true">${goal.icon}</span><div><span class="pill">${earned ? 'הושג!' : 'בדרך לשם'}</span><h2 class="small-gap">${goal.title}</h2><p>${goal.description}</p><progress max="${goal.target}" value="${earned && goal.id !== 'daily' ? goal.target : progress}" aria-label="התקדמות: ${goal.title}"></progress><small>${goal.id === 'daily' ? 'היום: ' : ''}${Math.round(progress)} / ${goal.target}${goal.id === 'speed' ? '%' : ''}${earned ? ` · הושג ב־${dateLabel(earned)}` : ''}</small></div></section>`;
                }).join('')}</div><div class="note space">מדליות שכבר הושגו נשארות באוסף. יעד התרגול היומי מתחדש בכל יום לפי השעה במכשיר.</div><button class="space" data-page="practice">ממשיכים לצבור הצלחות ←</button>`;
            }
            settingsScreen() {
                const settings = this.storage.data.settings;
                const preset = settings.min === 1 && [5,10,12,20].includes(settings.max) ? String(settings.max) : 'custom';
                return `${this.heading('בדיוק בקצב שלך', 'הטווח קובע את התרגול הכללי; הקבוצות קובעות את התרגול המותאם.')}<form id="settings-form" class="stack"><section class="card stack"><h2>טווחים והעדפות</h2><div class="field"><label for="range-preset">טווח מהיר</label><select id="range-preset">${[5,10,12,20].map(max => `<option value="${max}" ${preset === String(max) ? 'selected' : ''}>1–${max}</option>`).join('')}<option value="custom" ${preset === 'custom' ? 'selected' : ''}>טווח מותאם אישית</option></select></div><div class="form-grid"><div class="field"><label for="range-min">ממספר</label><input id="range-min" type="number" min="1" max="20" value="${settings.min}" required></div><div class="field"><label for="range-max">עד מספר</label><input id="range-max" type="number" min="1" max="20" value="${settings.max}" required></div><div class="field"><label for="default-table">ספרה לתרגול בודד</label><select id="default-table">${this.options(range(1,20),settings.table)}</select></div><div class="field"><label for="default-length">אורך סשן ברירת מחדל</label><select id="default-length">${this.options([10,20,30,50],settings.sessionLength)}</select></div><div class="field"><label for="slow-seconds">סף זמן לתרגול איטי, בשניות</label><input id="slow-seconds" type="number" min="3" max="60" value="${settings.slowSeconds}" required></div></div><p class="help">המספרים הנתמכים הם 1–20. טווח מותאם יכול להיות למשל 3–17.</p></section><div class="grid two"><fieldset class="card"><legend>קבוצה ראשונה · בחירה ידנית</legend><p class="help">מספר אחד או כמה. במצב קבוצה מול קבוצה משתמשים בקבוצה זו בשני הצדדים.</p><div class="row small-gap"><button type="button" class="secondary" data-action="pick-all" data-target="group-a">הכול</button><button type="button" class="ghost" data-action="pick-none" data-target="group-a">ניקוי בחירה</button></div>${this.numbers('group-a',settings.selected)}</fieldset><fieldset class="card"><legend>קבוצה שנייה · לתרגול מותאם</legend><p class="help">האופרנד השני נבחר מקבוצה זו. הבחירה הידנית אינה מוגבלת לטווח הכללי.</p><div class="row small-gap"><button type="button" class="secondary" data-action="copy-group">העתקה מהראשונה</button><button type="button" class="ghost" data-action="pick-none" data-target="group-b">ניקוי בחירה</button></div>${this.numbers('group-b',settings.secondSelected)}</fieldset></div><p class="error" id="form-error" role="alert" tabindex="-1"></p><button type="submit">שמירת ההגדרות</button></form><section class="card space"><h2>הנתונים שלך, במכשיר שלך</h2><p class="help">הנתונים נשמרים ב־LocalStorage בדפדפן זה, ללא שליחה לשרת. ניקוי נתוני האתר או גלישה פרטית עלולים למחוק את ההתקדמות. איפוס מוחק רק את נתוני האפליקציה הזאת.</p><button class="danger space" data-action="reset">איפוס כל הנתונים</button></section>`;
            }
            saveSettings() {
                const min = Number($('#range-min').value); const max = Number($('#range-max').value);
                const slow = Number($('#slow-seconds').value);
                const selected = this.selected('group-a'); const secondSelected = this.selected('group-b');
                if (!isNumber(min) || !isNumber(max) || min > max) { this.error('יש לבחור טווח תקין בין 1 ל־20.'); return; }
                if (!selected.length || !secondSelected.length) { this.error('יש לבחור לפחות מספר אחד בכל קבוצה.'); return; }
                if (!Number.isFinite(slow) || slow < 3 || slow > 60) { this.error('סף הזמן חייב להיות בין 3 ל־60 שניות.'); return; }
                this.storage.data.settings = { min,max,selected,secondSelected,slowSeconds:slow,table:Number($('#default-table').value),sessionLength:Number($('#default-length').value) };
                const saved = this.storage.save();
                this.render(); this.notify(saved ? 'ההגדרות נשמרו. אפשר להתחיל!' : 'ההגדרות עודכנו בדף זה, אך לא נשמרו בדפדפן.');
            }
            reset() {
                if (!confirm('למחוק לצמיתות את כל הניקוד, התוצאות, החזרות, ההישגים וההגדרות? לא ניתן לבטל פעולה זו.')) return;
                clearTimeout(this.timer); this.practice.stop(); this.tests.stop();
                this.storage.reset(); this.practiceMode = 'random'; this.testMode = 'range'; this.page = 'home'; this.render();
                this.notify('נתוני האפליקציה אופסו. מתחילים מחדש.');
            }
        }

        const storage = new StorageManager();
        const questions = new QuestionEngine();
        const adaptive = new AdaptiveEngine(storage, questions);
        const statistics = new StatisticsManager(storage, questions, adaptive);
        const achievements = new AchievementManager(storage);
        const practice = new PracticeEngine(storage, questions, adaptive, statistics);
        const tests = new TestEngine(storage, questions, adaptive, statistics);
        const ui = new UIManager(storage, questions, adaptive, new HintEngine(), practice, tests, statistics, achievements);
    </script>
</body>
</html>
