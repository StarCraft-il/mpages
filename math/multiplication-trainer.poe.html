<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>לוח הכפל — לומדים וזוכרים</title>
    <style>
        :root {
            --ink: #202344;
            --muted: #6c6f8a;
            --primary: #6558d3;
            --primary-dark: #5044b5;
            --bg: #f5f5ff;
            --card: #ffffff;
            --green: #18865b;
            --red: #c84255;
            --line: #e8e8f2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px 14px 40px;
            background: radial-gradient(ellipse at top, #ecebff, var(--bg) 55%);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 620px);
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 12px 8px 20px;
        }

        .logo {
            display: inline-grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin-bottom: 8px;
            border-radius: 19px;
            background: var(--primary);
            color: white;
            font-size: 27px;
            font-weight: 800;
            box-shadow: 0 8px 22px #6558d344;
        }

        h1 {
            margin: 0;
            font-size: clamp(25px, 7vw, 34px);
            letter-spacing: -0.5px;
        }

        header p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        .panel {
            padding: 18px;
            border: 1px solid #ffffff;
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 12px 36px #35356612;
        }

        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 5px;
            margin-bottom: 18px;
            border-radius: 15px;
            background: #f2f1fb;
        }

        button, select, input {
            font: inherit;
        }

        .tab {
            min-height: 46px;
            border: 0;
            border-radius: 11px;
            color: var(--muted);
            background: transparent;
            font-weight: 750;
            cursor: pointer;
        }

            .tab.active {
                color: var(--primary-dark);
                background: white;
                box-shadow: 0 2px 8px #23234a12;
            }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        label {
            font-weight: 700;
        }

        select {
            width: 150px;
            max-width: 55%;
            min-height: 44px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink);
            background: white;
        }

        .study-intro {
            margin: 0 0 14px;
            color: var(--muted);
            line-height: 1.55;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .fact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 53px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fdfdff;
            font-size: 16px;
        }

            .fact strong {
                color: var(--primary-dark);
                font-size: 18px;
            }

        .quiz-card {
            padding: 22px 16px;
            border-radius: 20px;
            background: linear-gradient(140deg, #f2f0ff, #faf9ff);
            text-align: center;
        }

        .quiz-label {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .question {
            margin: 0 0 17px;
            font-size: clamp(30px, 9vw, 44px);
            font-weight: 850;
            letter-spacing: 1px;
        }

        .answer-row {
            display: flex;
            justify-content: center;
            gap: 9px;
        }

        input {
            width: 112px;
            min-height: 50px;
            padding: 8px;
            border: 2px solid var(--line);
            border-radius: 13px;
            outline: none;
            text-align: center;
            font-size: 22px;
            font-weight: 750;
        }

            input:focus {
                border-color: var(--primary);
            }

        .primary-btn, .secondary-btn {
            min-height: 48px;
            padding: 10px 18px;
            border: 0;
            border-radius: 13px;
            font-weight: 750;
            cursor: pointer;
        }

        .primary-btn {
            color: white;
            background: var(--primary);
        }

            .primary-btn:hover {
                background: var(--primary-dark);
            }

        .secondary-btn {
            color: var(--primary-dark);
            background: #eeecff;
        }

        .quiz-actions {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-top: 12px;
        }

        .feedback {
            min-height: 27px;
            margin: 13px 0 0;
            font-weight: 750;
        }

            .feedback.good {
                color: var(--green);
            }

            .feedback.try {
                color: var(--red);
            }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-top: 16px;
            padding: 13px 8px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: white;
            text-align: center;
        }

            .scoreboard span {
                display: block;
                color: var(--muted);
                font-size: 12px;
            }

            .scoreboard strong {
                display: block;
                margin-top: 3px;
                font-size: 20px;
            }

        .tip {
            margin: 17px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 380px) {
            .panel {
                padding: 14px;
            }

            .fact {
                padding: 9px;
                font-size: 14px;
            }

                .fact strong {
                    font-size: 16px;
                }

            .primary-btn, .secondary-btn {
                padding-inline: 13px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="logo" aria-hidden="true">×</div>
            <h1>לוח הכפל</h1>
            <p>לומדים קצת, מתרגלים — וזוכרים!</p>
        </header>

        <section class="panel" aria-label="תרגול לוח הכפל">
            <div class="mode-tabs" role="tablist" aria-label="בחירת מצב">
                <button class="tab active" id="studyTab" type="button" role="tab"
                        aria-selected="true" aria-controls="studyPanel">
                    לומדים
                </button>
                <button class="tab" id="quizTab" type="button" role="tab"
                        aria-selected="false" aria-controls="quizPanel">
                    מתרגלים
                </button>
            </div>

            <div class="controls">
                <label for="tableSelect">איזה לוח נלמד?</label>
                <select id="tableSelect" aria-label="בחירת לוח הכפל"></select>
            </div>

            <section id="studyPanel" role="tabpanel" aria-labelledby="studyTab">
                <p class="study-intro">הסתכלו על התרגילים והתשובות. אפשר לבחור לוח אחר ולתרגל בקצב שלכם.</p>
                <div id="tableGrid" class="table-grid"></div>
            </section>

            <section id="quizPanel" role="tabpanel" aria-labelledby="quizTab" hidden>
                <div class="quiz-card">
                    <p class="quiz-label">מה התשובה?</p>
                    <p class="question" id="question" aria-live="polite"></p>
                    <form id="answerForm" class="answer-row">
                        <input id="answerInput" type="number" inputmode="numeric"
                               autocomplete="off" aria-label="התשובה שלך">
                        <button class="primary-btn" type="submit">בדיקה</button>
                    </form>
                    <p id="feedback" class="feedback" aria-live="polite"></p>
                    <div class="quiz-actions">
                        <button id="hintBtn" class="secondary-btn" type="button">רמז</button>
                        <button id="nextBtn" class="secondary-btn" type="button">שאלה חדשה</button>
                    </div>
                </div>

                <div class="scoreboard" aria-label="ניקוד">
                    <div><span>נכונות</span><strong id="correctCount">0</strong></div>
                    <div><span>ניסיונות</span><strong id="attemptCount">0</strong></div>
                    <div><span>רצף שיא</span><strong id="streakCount">0</strong></div>
                </div>
                <p class="tip">טיפ: נסו לומר את התשובה בקול לפני שאתם מקלידים אותה.</p>
            </section>
        </section>
    </main>

    <script>
        const tableSelect = document.getElementById("tableSelect");
        const tableGrid = document.getElementById("tableGrid");
        const studyTab = document.getElementById("studyTab");
        const quizTab = document.getElementById("quizTab");
        const studyPanel = document.getElementById("studyPanel");
        const quizPanel = document.getElementById("quizPanel");
        const questionEl = document.getElementById("question");
        const answerInput = document.getElementById("answerInput");
        const feedback = document.getElementById("feedback");
        const correctCountEl = document.getElementById("correctCount");
        const attemptCountEl = document.getElementById("attemptCount");
        const streakCountEl = document.getElementById("streakCount");

        for (let n = 1; n <= 12; n++) {
            const option = document.createElement("option");
            option.value = n;
            option.textContent = `לוח ${n}`;
            tableSelect.appendChild(option);
        }

        let currentFactor = 1;
        let currentMultiplier = 1;
        let correctCount = 0;
        let attemptCount = 0;
        let streak = 0;
        let bestStreak = 0;
        let answered = false;

        function renderTable() {
            const factor = Number(tableSelect.value);
            tableGrid.replaceChildren();

            for (let n = 1; n <= 12; n++) {
                const row = document.createElement("div");
                row.className = "fact";

                const equation = document.createElement("span");
                equation.textContent = `${factor} כפול ${n}`;

                const answer = document.createElement("strong");
                answer.textContent = factor * n;

                row.append(equation, answer);
                tableGrid.appendChild(row);
            }
        }

        function newQuestion() {
            currentFactor = Number(tableSelect.value);
            currentMultiplier = Math.floor(Math.random() * 12) + 1;
            questionEl.textContent = `${currentFactor} כפול ${currentMultiplier} שווה?`;
            answerInput.value = "";
            answerInput.disabled = false;
            answered = false;
            feedback.textContent = "";
            feedback.className = "feedback";
        }

        tableSelect.addEventListener("change", () => {
            renderTable();
            if (!quizPanel.hidden) newQuestion();
        });

        function showMode(mode) {
            const studying = mode === "study";
            studyPanel.hidden = !studying;
            quizPanel.hidden = studying;
            studyTab.classList.toggle("active", studying);
            quizTab.classList.toggle("active", !studying);
            studyTab.setAttribute("aria-selected", String(studying));
            quizTab.setAttribute("aria-selected", String(!studying));
            if (!studying) {
                newQuestion();
                answerInput.focus();
            }
        }

        studyTab.addEventListener("click", () => showMode("study"));
        quizTab.addEventListener("click", () => showMode("quiz"));

        document.getElementById("answerForm").addEventListener("submit", (event) => {
            event.preventDefault();
            if (answered) return;

            const value = answerInput.value.trim();
            if (value === "") {
                feedback.textContent = "כתבו תשובה כדי לבדוק.";
                feedback.className = "feedback try";
                answerInput.focus();
                return;
            }

            attemptCount++;
            attemptCountEl.textContent = attemptCount;

            if (Number(value) === currentFactor * currentMultiplier) {
                correctCount++;
                streak++;
                bestStreak = Math.max(bestStreak, streak);
                correctCountEl.textContent = correctCount;
                streakCountEl.textContent = bestStreak;
                feedback.textContent = "נכון מאוד! 🎉";
                feedback.className = "feedback good";
                answered = true;
                answerInput.disabled = true;
            } else {
                streak = 0;
                feedback.textContent = "כמעט! נסו שוב.";
                feedback.className = "feedback try";
            }
        });

        document.getElementById("hintBtn").addEventListener("click", () => {
            feedback.textContent =
                `${currentFactor} כפול ${currentMultiplier} — חשבו בקפיצות של ${currentFactor}.`;
            feedback.className = "feedback";
        });

        document.getElementById("nextBtn").addEventListener("click", newQuestion);

        renderTable();
    </script>
</body>
</html>
